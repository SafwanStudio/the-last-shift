:root{color-scheme:dark;--fg:#b8ffd0;--dim:#4a8a64;--panel:#0c1a14;--red:#ff3b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:'Handjet','Courier New',monospace;line-height:1.3;color:var(--fg);user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#wrap{width:min(100vw,160vh);aspect-ratio:8/5;position:relative;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#cv{width:100%;height:100%;transform-origin:81% 45%;transition:transform 1.8s cubic-bezier(.6,0,.3,1)}
#wrap.zoom #cv{transform:scale(7)}
#wrap.nt #cv{transition:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#000 105%)}
#hud{position:absolute;top:8px;right:10px;font-size:20px;color:var(--dim);z-index:2}
#hint{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:14px;color:var(--dim);z-index:3;pointer-events:none;opacity:.8}
#pad{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:3;direction:ltr}
#pad button{width:68px;height:68px;font-size:26px;background:rgba(10,20,15,.7);color:var(--fg);border:2px solid var(--dim);touch-action:none;font-family:inherit}
#pad .l{display:flex;gap:10px}
#sit{width:auto!important;padding:0 18px;font-size:24px!important;height:56px!important;border-color:var(--fg)!important;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.5}}
.hide{display:none!important}
#os{position:fixed;inset:0;background:#0d2b26;display:flex;flex-direction:column;opacity:1;transition:opacity .7s,background .5s;z-index:5;font-size:clamp(15px,2.4vw,19px)}
#os.off{opacity:0;pointer-events:none}
#os.fc,#os.fc *{cursor:none!important}
#os.shake{animation:sh .09s infinite}
@keyframes sh{0%{transform:translate(3px,-2px)}50%{transform:translate(-4px,2px)}100%{transform:translate(2px,3px)}}
#os.inv{filter:invert(1)}
#os.wp{animation:wp 1.1s steps(1) infinite}
@keyframes wp{0%{background:#0d2b26}25%{background:#2b0d0d}50%{background:#0d0d2b}75%{background:#000}}
#os.dead{background:#000;animation:none}#os.dead>*{visibility:hidden}
#crt{position:absolute;inset:0;pointer-events:none;z-index:70;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:fl .15s infinite}
@keyframes fl{50%{opacity:.8}}
#dim{position:absolute;inset:0;pointer-events:none;z-index:69;background:#000;opacity:0}
#cur{position:fixed;left:0;top:0;width:12px;height:18px;background:#fff;clip-path:polygon(0 0,100% 62%,55% 64%,80% 100%,55% 100%,35% 70%,0 90%);z-index:65;pointer-events:none;display:none}
#top{padding:8px 12px;background:#06140f;border-bottom:2px solid var(--dim);display:flex;justify-content:space-between;gap:10px}
#task{color:#ffd86b}
#desk{flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:14px}
#dock,#files{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
#dock{padding-bottom:10px;border-bottom:1px dashed var(--dim)}
.ic{width:78px;text-align:center;touch-action:none;cursor:pointer}
.ic.ghost{position:fixed;z-index:40;pointer-events:none;opacity:.85}
.ic.src{opacity:.25}.ic.hot .g{border-color:var(--red)!important;transform:scale(1.12)}
.g{display:block;margin:0 auto 4px;width:38px;height:42px;border:2px solid var(--fg);background:var(--panel);line-height:42px;font-style:normal;font-size:14px;box-shadow:3px 3px 0 #000}
.ic.app .g{border-color:#ffd86b;color:#ffd86b}.ic.fold .g{border-color:#5ac;color:#5ac}
.ic span{font-size:15px;word-break:break-all;display:block}
#bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:#06140f;border-top:2px solid var(--dim)}
#sleep{font-family:inherit;background:var(--panel);color:var(--fg);border:2px solid var(--fg);padding:4px 12px;font-size:17px}
#sleep:disabled{opacity:.3;border-color:var(--dim)}
.win{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,440px);background:#0b1c16;border:2px solid var(--fg);box-shadow:5px 5px 0 #000;z-index:10}
#win{top:8%;z-index:10;max-height:80%;display:flex;flex-direction:column}#cam{top:12%;left:auto;right:2%;transform:none;width:min(70vw,320px);z-index:20;border-color:var(--red)}#dlg{top:30%;z-index:30;border-color:#ffd86b}
.wh{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--fg);color:#04100a;font-weight:700}
#cam .wh{background:var(--red);color:#fff}#dlg .wh{background:#ffd86b}
.wh button{font-family:inherit;background:none;border:0;color:inherit;font-size:20px}
#pc,#cc{width:100%;background:#000}
#cc{filter:grayscale(1) contrast(1.4) brightness(1.2) sepia(.4) hue-rotate(60deg)}
#wb{padding:10px;overflow:auto;font-size:17px;line-height:1.6;white-space:pre-wrap}
#wb.red{color:var(--red);font-size:30px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #123;flex-wrap:wrap}
.row>b{cursor:pointer;font-weight:400}
.mini{font-family:inherit;font-size:16px;background:var(--panel);color:var(--fg);border:1px solid var(--dim);padding:2px 8px;margin-inline-start:4px}
#wb textarea{width:100%;min-height:150px;box-sizing:border-box;background:#000;color:var(--fg);border:1px solid var(--dim);font:inherit;font-size:20px;padding:8px;user-select:text;-webkit-user-select:text;resize:none}
#wb input[type=range]{width:100%}
.db{padding:12px;font-size:17px}.db p{margin:0 0 10px;line-height:1.6}
.db input{width:100%;box-sizing:border-box;background:#000;color:var(--fg);border:2px solid var(--fg);padding:8px;font:inherit;font-size:20px;margin-bottom:10px;user-select:text;-webkit-user-select:text}
.db button{font-family:inherit;font-size:20px;background:var(--panel);color:var(--fg);border:2px solid var(--fg);padding:6px 16px;margin-inline-end:8px}
#fade,#title,#end{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;z-index:80}
#fade{opacity:0;pointer-events:none;transition:opacity .9s;z-index:75;font-size:30px;color:var(--dim)}
#fade.on{opacity:1;pointer-events:auto}
#title h1,#end h1{font-size:clamp(36px,9vw,64px);margin:0;letter-spacing:2px}
#title h1{text-shadow:3px 0 var(--red),-3px 0 #2ad}
#title p,#end p{color:var(--dim);margin:0;max-width:400px;line-height:1.7;font-size:22px}
.btn{font-family:inherit;font-size:26px;background:none;color:var(--fg);border:2px solid var(--fg);padding:8px 30px;box-shadow:4px 4px 0 var(--dim);cursor:pointer;outline:none;user-select:none}
.btn:hover,.btn:focus{background:var(--panel);border-color:#fff;box-shadow:4px 4px 0 var(--fg)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--fg)}
#end{z-index:90}
#end #ev{opacity:0;margin-top:6px;font-size:20px;color:#ffd86b;border:1px dashed #ffd86b;padding:8px 14px;animation:evin 2s 2.2s ease forwards}#end #ev:empty{display:none}@keyframes evin{to{opacity:1}}#end #eq{opacity:0;margin-top:4px;animation:eqin 3s 4.8s ease forwards}#end #ef{opacity:0;display:flex;flex-direction:column;gap:6px;max-width:400px;margin-top:8px;padding-top:14px;border-top:1px solid var(--dim);color:var(--dim);font-size:20px;line-height:1.7;animation:evin 2.5s 3s ease forwards}#end #ef b{color:var(--fg);font-size:24px;font-weight:normal}#end #ef.hide{display:none}#end #eq:empty{display:none}@keyframes eqin{to{opacity:.6}}
#lock{position:absolute;inset:0;z-index:60;background:#061410;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;font-size:clamp(16px,2.6vw,20px)}
#lock .tbl{width:min(92vw,440px);border:2px solid var(--dim);padding:8px;text-align:right;line-height:1.9}
#lock h2{margin:0;font-size:1.6em}#lock .btn{font-size:22px;padding:6px 20px}
#sec{color:#ffd86b}.row input{width:22px;height:22px}.row small{color:var(--dim)}
button,input,textarea{line-height:1.4}.wh{cursor:move;touch-action:none}.wh button{cursor:pointer}

#lang,#dev{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px;z-index:100}
#lang h2,#dev h2{margin:0;font-size:30px;font-weight:400}
.opts{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.opt{background:none;border:2px solid var(--dim);color:var(--fg);font-family:inherit;font-size:28px;padding:14px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.opt:hover,.opt:active{border-color:var(--fg);box-shadow:4px 4px 0 var(--dim)}
.opt canvas{width:128px;height:128px}
#desk{position:relative}
html.pc #os{font-size:clamp(16px,1.5vw,21px)}
html.pc #desk{flex-direction:row;background:radial-gradient(circle at 60% 50%,#123a34,#0a1d1a 70%)}
html.pc #desk::after{content:'FILES·OS';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12vw;color:rgba(184,255,208,.05);pointer-events:none}
html.pc #dock{flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:12px;padding:14px;border:0;border-inline-end:1px dashed var(--dim);max-height:100%;z-index:1}
html.pc #win{top:50%;left:50%;transform:translate(-50%,-50%);width:min(66vw,700px);height:min(66vh,520px);max-height:none}
html.pc #cam{top:14%;right:3%;left:auto;transform:none;width:min(28vw,340px)}
html.pc #dlg{top:50%;left:50%;transform:translate(-50%,-50%);width:min(40vw,420px)}
html.ph #os{font-size:clamp(19px,5vw,24px)}
html.ph #desk{flex-direction:column;justify-content:center;background:radial-gradient(circle at 50% 40%,#123a34,#0a1d1a 70%)}
html.ph #dock{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:16px;border:0;justify-items:center;align-content:center}
html.ph .ic{width:100px}html.ph .g{width:60px;height:64px;line-height:64px;font-size:18px}html.ph .ic span{font-size:20px}
html.ph #win,html.ph #dlg{top:50%;left:50%;transform:translate(-50%,-50%);width:94vw}
html.ph #win{height:74vh;max-height:none}
html.ph #cam{top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:92vw}
html.ph .mini{font-size:20px;padding:6px 14px;margin:3px}html.ph .row{padding:10px 0}html.ph .row input{width:30px;height:30px}
html.ph #wb,html.ph .db{font-size:20px}
.mini.big{font-size:1.1em;padding:6px 16px;border-color:var(--fg)}
#win #wb{flex:1;min-height:0;overflow:auto}
#pc{max-height:55%;object-fit:contain}
html[lang=en] h1,html[lang=en] #lock h2{font-family:PS2P,Handjet,monospace}
html[lang=en] #title h1,html[lang=en] #end h1{font-size:clamp(22px,5vw,38px);line-height:1.4}
html[dir=ltr] #hud{right:auto;left:10px}
#say{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(92vw,560px);background:#06140fee;border:2px solid var(--fg);padding:10px 14px;z-index:74;font-size:20px;box-shadow:4px 4px 0 #000;cursor:pointer}
#say b{color:#ffd86b;margin-inline-end:8px}
#wb.web{padding:0}
.br-bar{display:flex;gap:6px;align-items:center;padding:6px;background:#0b1c16;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--dim)}
.br-url{flex:1;background:#000;border:1px solid var(--dim);padding:2px 8px;overflow:hidden;white-space:nowrap;direction:ltr;text-align:left;font-size:.9em}
.pg{padding:14px;background:#e4f5ea;color:#0a2a1a;min-height:100%;white-space:pre-wrap}
.pg h2,.pg h3{margin:0 0 8px;font-weight:700}
.pg .br-q{width:100%;box-sizing:border-box;padding:8px;font:inherit;font-size:1.1em;margin-bottom:8px;background:#fff;color:#000;border:2px solid #0a2a1a;user-select:text;-webkit-user-select:text}
.pg .mini{background:#fff;color:#0a2a1a;border-color:#0a2a1a}
.site{padding:8px 0;border-bottom:1px solid #9fc4ae}.site b{cursor:pointer;color:#0a4aa0}.site small{display:block;color:#3a6a50;direction:ltr;text-align:start}
.pr{font-weight:700;color:#a00}.pr.free{color:#0a7a2a}
.sec{padding:18px 10px;min-height:38vh;line-height:1.6}

<script>
let LANG='ar',DEV='pc';const $=s=>document.querySelector(s);
const h=(tag,txt,fn,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;if(cls)e.className=cls;return e};
const S={day:0,phase:'title',sh:['_','_','_','_'],name:'أنت',notes:'ملاحظاتي:\n',log:[],wt:0,mut:0,wpi:0};
const FS={سطح:[],مستندات:[],صور:[],محذوفات:[]};
const HOME={doc:'مستندات',pic:'صور',tmp:'محذوفات'};
/* ---------- audio ---------- */
let AC,master,hg,fan;
function audioInit(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;lp.connect(master);
    [55,57.3].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(lp);o.start()});
    const hh=AC.createOscillator();hg=AC.createGain();hg.gain.value=0;hh.frequency.value=3100;hh.connect(hg).connect(master);hh.start();
    const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const s=AC.createBufferSource(),f=AC.createBiquadFilter();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=500;
    fan=AC.createGain();fan.gain.value=.05;s.connect(f).connect(fan).connect(master);s.start();
  }catch(e){}
}
function tension(){if(hg)hg.gain.value=Math.max(0,S.day-3)*.005}
function beep(f=440,d=.06,v=.05,type='square'){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(master);o.start();o.stop(AC.currentTime+d);
}
function noise(d=.3,v=.3){
  if(!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(master);s.start();
}
document.addEventListener('pointerdown',()=>beep(1200,.02,.025));
/* ---------- drawing ---------- */
const cv=$('#cv'),cx=cv.getContext('2d'),cc=$('#cc').getContext('2d'),W=160,H=100;
let X=cx,px=46,sitting=false,keys={l:0,r:0},t=0,last=0,stepT=0,flick=1;
function R(c,x,y,w,hh){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,hh)}
/* ---- Bob: blocky pixel character (bald, faceless) ---- */
const SKN='#d9b08c',SKD='#b88a68',SKH='#ecd0ae',SH1='#4a7da6',SH2='#34587a',PN1='#2b2f3d',PN2='#1d2029',SHO='#101014';
function drawBob(x,y,mv,fl,up,anchor,sit){
  const top=(sit||anchor===16)?y-4:y-8;
  const ph=t*10,sw=mv?Math.round(Math.sin(ph)*2):0,lift=mv?Math.max(0,Math.round(Math.sin(ph+1.6))):0;
  const b=mv?(Math.abs(Math.sin(ph))>.6?1:0):(Math.sin(t*2.2)>.65?1:0);
  const q=(c,cx,cy,w,h)=>R(c,fl?x+12-cx-w:x+cx,top+cy,w,h);
  if(sit){q(PN1,2,20,9,3);q(PN2,9,23,3,6);q(SHO,9,29,5,1)}
  else if(anchor!==16){q(PN2,3-sw,20,3,8);q(SHO,3-sw,28,5,2);q(PN1,6+sw,20,3,8-lift);q(SHO,6+sw,28-lift,5,2)}
  const o=sit?0:b;
  q(SKN,3,o,6,6);q(SKD,3,o,2,6);q(SKH,6,o,3,1);
  q(SKD,5,6+o,2,2);
  q(SH1,1,8+o,10,11);q(SH2,1,8+o,3,11);q(PN1,1,19+o,10,1);
  if(sit){const ty=Math.sin(t*14)>0?0:1;q(SH2,4,9,3,5);q(SH1,6,13,8,3);q(SKN,14,13+ty,3,3)}
  else if(up){q(SH1,9,0,3,9);q(SKN,9,-3,3,3)}
  else{q(SH2,4-sw,9+o,3,8);q(SKN,4-sw,17+o,3,3)}
}
/* ---- the bedroom ---- */
function drawRoom(ctx,o={}){
  X=ctx;const d=S.day,sit=o.sit||sitting,wk=S.phase==='wake'?S.wt:99;
  /* wall + wainscot + floor */
  R('#16131d',0,0,W,69);
  for(let x=0;x<W;x+=8)R('#1a1722',x,0,4,69);
  for(let y=4;y<42;y+=10)for(let x=2;x<W;x+=16)R('#201c2a',x+((y/10|0)%2)*8,y,2,2);
  R('#2b2236',0,43,W,1);R('#110e17',0,44,W,25);
  for(let x=0;x<W;x+=10)R('#171320',x,46,1,20);
  R('#2a2233',0,66,W,3);R('#3a2f48',0,66,W,1);
  R('#0f0c13',0,69,W,31);
  for(let y=69;y<100;y+=5)R('#14101a',0,y,W,1);
  for(let x=0;x<W;x+=14)for(let y=69;y<100;y+=10)R('#120e17',x+((y/10|0)%2)*7,y+1,1,4);
  /* rug */
  R('#2a1c36',58,82,50,14);R('#3b2850',60,84,46,10);R('#4a3366',62,86,42,6);
  for(let x=64;x<102;x+=6)R('#2a1c36',x,88,2,2);
  /* shelf: books, plant, clock */
  R('#2b1f18',27,35,28,2);R('#3a2a20',27,35,28,1);

    const box=h('div',null,null,'hm-box');box.append(h('div',tr('hmq'),null,'hm-l'),q,h('button',tr('wgo'),search,'gbtn'));
    const pop=h('div',null,null,'hm-pop');pop.append(h('span',tr('hmpop')+' '),h('a',tr('wchip'),()=>{q.value=tr('wchip');search()},'rt'));
    const dir=h('div',null,null,'hm-dir');tr('hmcat').forEach(c=>dir.append(h('span',c,null,'hm-cat')));
    P.append(top,box,pop,dir,h('div',tr('hmfoot'),null,'sm'));P.classList.add('home');
  }else if(pg==='none')P.append(logo('sm'),h('div',tr('wnone')));
  else if(pg==='res'){
    const n=sites.filter(s=>!(s[4]&&S.dl)).length;
    P.append(logo('sm'),h('div',tr('wcount',n),null,'cnt'));
    sites.forEach(s=>{if(s[4]&&S.dl)return;const r=h('div',null,null,'res');r.append(h('a',s[0],()=>s[4]?web('free'):web('paid',s),'rt'),h('div',s[1],null,'ru'),h('div',s[2]+' — '+s[3],null,'rd'));P.append(r)});
    if(S.dl&&!S.nf)setTimeout(()=>{if(S.pg==='res'&&!S.nf){S.nf=1;say([tr('wnf')],()=>askInstall())}},3000);
  }else if(pg==='paid'){
    P.append(h('h2',arg[0]),h('div',arg[2]),h('h2',arg[3],null,'pr'),h('div',tr('wfeat')),h('button',tr('wbuy'),()=>say([tr('wpaid')]),'gbtn'));
  }else if(pg==='free'){
    const f=tr('wf'),hd=h('div',null,null,'sh-top');hd.append(ico('sec',2),h('b',f[0]),h('span',tr('newb'),null,'new'));
    const nav=h('div',null,null,'sh-nav');tr('shnav').forEach(x=>nav.append(h('span',x)));
    const b1=h('div',null,null,'bev');b1.append(h('h2',f[1]),h('div',f[2]));
    P.append(hd,nav,b1,h('div',f[3],null,'bev'),h('div',f[4],null,'bev'),h('button',f[5],()=>web('ads'),'gbtn dlb'),h('div',f[6],null,'sm'));
    if(!S.fsaid){S.fsaid=1;say([tr('wfree')])}
  }else if(pg==='ads'){
    P.append(h('h2',tr('adt')),h('div',tr('adf')));
    const board=h('div',null,null,'board');
    const fake=()=>{S.fk=(S.fk||0)+1;noise(.2,.2);beep(150,.1,.06,'sawtooth');for(let i=0;i<2;i++)board.append(mkAd(AD(),Math.random()*55,Math.random()*520,board,fake));if(S.fk===3)say([tr('wads')])};
    const pos=[[2,6],[50,24],[2,170],[50,190],[2,372],[50,392],[2,540],[50,560]];
    tr('ads').forEach((a,i)=>{const q=pos[i%pos.length];board.append(mkAd(a,q[0],q[1],board,fake))});
    const rr=h('div',null,null,'freal');rr.append(ico('zip',2,1),h('span',tr('realdl')),h('button',tr('dlb2'),()=>web('dl'),'gbtn'));board.append(rr);
    P.append(board);
    if(!S.adsaid){S.adsaid=1;say([tr('wadsin')])}
  }else if(pg==='dl'){
    const bar2=h('i'),pb=h('div',null,null,'pbar'),pc=h('div','0%');pb.append(bar2);P.append(h('h3',tr('wdl')),pb,pc);
    let p=0;S.dlIv=setInterval(()=>{
      p=Math.min(99,p+Math.random()*9+3);bar2.style.width=p+'%';pc.textContent=Math.floor(p)+'%';beep(200+p*3,.02,.02);
      if(p>=99){clearInterval(S.dlIv);stall()}},200);
  }
  const st=h('div',null,null,'ie-status');st.append(h('span',pg==='dl'?tr('wdl'):tr('ready')),h('span',tr('inet')));
  win(tr('webn'),[menu,tool,addr,body,st]);
  $('#wb').classList.add('web');$('#win').classList.add('big','ie');
}
function stall(){
  if(S.pg!=='dl')return;const o=$('#os');S.st=[];
  const T2=(ms,f)=>S.st.push(setTimeout(()=>{if(S.pg==='dl')f()},ms));
  T2(2000,()=>say([tr('wstall')]));
  T2(5000,()=>{o.classList.add('blur');noise(1.5,.4);beep(80,1.5,.12,'sawtooth')});
  T2(8000,()=>{o.classList.add('hang');noise(2,.6)});
  T2(10500,()=>{$('#win').classList.add('hide');o.classList.remove('blur','hang');S.pg=null;S.dl=1;say(tr('wgone'),()=>{S.task=tr('ptask2');$('#task').textContent=S.task})});
}
function askInstall(){
  ask(tr('instT'),tr('instQ'),0,[tr('instY'),tr('instN')],k=>k==0?install():(S.phase='fading',fade('…',1600,()=>finish(tr('endD'),1))));
}
function install(){
  S.inst=1;const B=h('div',tr('insting'));win(tr('instT'),[B]);let i=0;
  const iv=setInterval(()=>{i++;B.textContent=tr('insting')+' '+'▮'.repeat(i)+'▯'.repeat(8-i);beep(180+i*40,.05,.04);
    if(i>=8){clearInterval(iv);$('#os').classList.add('shake');noise(1,.5);
      setTimeout(()=>{$('#os').classList.remove('shake');$('#win').classList.add('hide');say([tr('sayDone')],goDay1)},1000)}},300);
}
function goDay1(){
  S.phase='fading';
  fade(tr('nextday'),3000,()=>{
    S.day=1;$('#os').classList.add('off');$('#win').classList.add('hide');
    const w=$('#wrap');w.classList.add('nt');w.classList.remove('zoom');void w.offsetWidth;w.classList.remove('nt');
    tension();startWake();$('#hint').textContent='';
  });
}
/* ---------- day 6: the window, the door, the living room ---------- */
let lx=110;
function jolt(){
  if(AC){
    const o=AC.createOscillator(),g=AC.createGain(),n0=AC.currentTime;
    o.type='sine';o.frequency.setValueAtTime(70,n0);o.frequency.exponentialRampToValueAtTime(28,n0+.5);g.gain.setValueAtTime(1,n0);g.gain.exponentialRampToValueAtTime(.001,n0+.6);o.connect(g).connect(master);o.start();o.stop(n0+.65);
    const q=AC.createOscillator(),g2=AC.createGain();q.type='sawtooth';q.frequency.setValueAtTime(900,n0);q.frequency.exponentialRampToValueAtTime(120,n0+.25);g2.gain.setValueAtTime(.25,n0);g2.gain.exponentialRampToValueAtTime(.001,n0+.3);q.connect(g2).connect(master);q.start();q.stop(n0+.32);
  }
  noise(.4,.9);const w=$('#wrap');w.classList.remove('jolt');void w.offsetWidth;w.classList.add('jolt');setTimeout(()=>w.classList.remove('jolt'),500);
}
function morning6(){
  S.phase='cut2';$('#pad').classList.add('hide');
  say(tr('e6a'),()=>{
    S.ent={x:12,y:44};noise(.6,.3);beep(90,.6,.1,'sawtooth');
    say(tr('e6b'),()=>{S.phase='chase';S.chd=0});
  });
}
function tick6(dt){
  if(S.day!==6)return;
  if(S.phase==='wake'){
    if(S.wt>1.6&&!S.wxd){S.wxd=1;S.wxt=0;jolt()}
  }
  if(S.wxd===1){S.wxt+=dt;S.wx=(S.wxt<.14||(S.wxt>.22&&S.wxt<.34))?84:undefined;if(S.wxt>=.34){S.wx=undefined;S.wxd=2}}
  if(S.phase==='chase'){
    px=Math.max(10,px-70*dt);
    if(px<=10&&!S.chd){S.chd=1;S.ent=null;noise(.3,.2);fade('',1000,()=>{S.phase='living';lx=110;S.lt=0;S.lsaid=0;if(DEV==='ph')$('#pad').classList.remove('hide')})}
  }
  if(S.phase==='living'){
    lx=Math.max(26,Math.min(140,lx+(keys.r-keys.l)*34*dt));S.lt+=dt;
    if(S.lt>5&&!S.lsaid){S.lsaid=1;keys.l=keys.r=0;say(tr('e6c'),()=>fade('',1200,()=>{S.phase='room';px=28;S.ent=null;if(DEV==='ph')$('#pad').classList.remove('hide')}))}
  }
}
function drawLiving(){
  X=cx;R('#14121a',0,0,W,66);for(let x=0;x<W;x+=10)R('#181520',x,0,5,66);R('#2a2233',0,63,W,3);R('#3a2f48',0,63,W,1);R('#0c0a10',0,66,W,34);
  for(let y=66;y<100;y+=6)R('#110e16',0,y,W,1);
  R('#2a2233',58,16,24,28);R('#08102a',60,18,20,24);R('#0b1636',60,28,20,14);R('#e8e8c0',72,22,4,4);R('rgba(232,232,192,.1)',68,18,12,10);R('#2a2233',69,18,1,24);R('#3a1f2a',55,16,5,28);R('#3a1f2a',80,16,5,28);R('#4a2a38',57,16,1,28);R('#4a2a38',82,16,1,28);
  R('#4a3358',16,46,50,18);R('#3a2848',16,42,50,6);R('#2e2036',14,46,5,20);R('#2e2036',63,46,5,20);R('#5a4068',20,50,20,10);R('#5a4068',42,50,20,10);R('#2e2036',16,64,50,2);
  R('#1a1a22',108,38,34,24);R('#050505',110,40,30,20);
  for(let i=0;i<34;i++)R(Math.random()>.5?'#2a3a44':'#0a1218',110+(Math.random()*28|0),40+(Math.random()*18|0),2,1);
  R('#2a2f3a',118,62,14,3);R('#2a2f3a',112,65,26,2);
  R('#2a1c36',50,82,70,12);R('#3b2850',52,84,66,8);R('#3a2a20',70,72,34,3);R('#2b1f18',72,75,3,8);R('#2b1f18',99,75,3,8);R('#e8e4d8',78,69,4,3);
  R('#2b1f18',92,38,3,26);R('#e8c070',89,32,9,7);R('#c89a40',89,38,9,1);
  R('#1e3a2a',4,46,10,18);R('#2e5a3a',2,36,14,12);R('#3a8a4a',5,33,8,6);
  R('#241e2c',146,33,12,40);R('#08070b',148,35,8,38);R('#3a2f48',148,54,2,2);
  drawBob(lx,57,!!(keys.l||keys.r),!!(keys.l&&!keys.r));
  const k=cx.createRadialGradient(lx+4,60,6,lx+4,60,74);k.addColorStop(0,'rgba(0,0,0,0)');k.addColorStop(1,'rgba(0,0,0,.86)');
  cx.fillStyle=k;cx.fillRect(0,0,W,H);
  const g=cx.createRadialGradient(125,50,2,125,50,34);g.addColorStop(0,'rgba(90,140,170,.15)');g.addColorStop(1,'rgba(90,140,170,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
}
$('#fail').onclick=()=>{if(S.phase!=='os'||S.day<1||S.day>6)return;ask(tr('failt'),tr('failq'),0,[tr('yes'),tr('no')],k=>{if(k==0){S.skipped=S.day;if(!S.fail.includes(S.day))S.fail.push(S.day);$('#sleep').disabled=false;$('#fail').classList.add('hide');S.task=tr('failn');$('#task').textContent=S.task}})};
$('#task').onclick=showTasks;
function helpNodes(){const L=h('div');tr('help').forEach(x=>{L.append(h('h3',x[0],null,'hh'),h('p',Array.isArray(x[1])?x[1][DEV==='ph'?1:0]:x[1]))});return L}
function helpWin(){win(tr('helpb'),[helpNodes()])}
function showHow(){const p=h('div',null,null,'panel');p.append(h('h2',tr('howt')),helpNodes(),h('button',tr('close'),()=>$('#how').classList.add('hide'),'btn'));$('#how').replaceChildren(p);$('#how').classList.remove('hide')}
$('#howb').onclick=showHow;
/* ---------- draggable windows ---------- */
const WINS=['#win','#cam','#dlg'].map(x=>$(x));
function front(w){WINS.splice(WINS.indexOf(w),1);WINS.push(w);WINS.forEach((x,i)=>x.style.zIndex=10+i*10)}
function autoCam(){
  if(S.phase!=='os'||S.sh[2]!=='_')return;
  if(!$('#dlg').classList.contains('hide')){setTimeout(autoCam,8000);return}
  openCam();
}
WINS.forEach(w=>{
  const hd=w.querySelector('.wh');
  w.addEventListener('pointerdown',()=>front(w));
  hd.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    const r=w.getBoundingClientRect(),o=$('#os').getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
    w.style.transform='none';w.style.right='auto';w.style.left=(r.left-o.left)+'px';w.style.top=(r.top-o.top)+'px';
    hd.setPointerCapture(e.pointerId);
    const mv=ev=>{w.style.left=Math.max(0,Math.min(o.width-80,ev.clientX-o.left-dx))+'px';w.style.top=Math.max(0,Math.min(o.height-40,ev.clientY-o.top-dy))+'px'};
    const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up)};
    hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up);
  });
});
requestAnimationFrame(loop);
